services:
  mongo:
    image: mongo:7
    container_name: rag-mongo
    restart: always
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ..
    container_name: rag-backend
    restart: always
    env_file: ../.env
    environment:
      - MONGO_URI=mongodb://mongo:27017
    ports:
      - "8000:8000"
    depends_on:
      - mongo

  frontend:
    build: ..
    container_name: rag-frontend
    restart: always
    command: streamlit run frontend/ui.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    environment:
      - BACKEND_URL=http://backend:8000/api/v1/rag
    ports:
      - "8501:8501"
    depends_on:
      - backend

  #NOTE: the boilerplate's mysql/redis services were removed — the RAG
  #pipeline uses MongoDB only, and mysql's hardcoded 3306 bind broke `up`.

volumes:
  mongo_data:
